### deepspeed
# deepspeed: ds_configs/ZeRO2.json
# deepspeed: ds_configs/ZeRO0.json

### model
model_name_or_path: ./ckpts/Qwen2.5-7B-Instruct
print_param_status: false
resume_from_checkpoint: false

### method
stage: sft
do_train: true
do_predict: false
predict_with_generate: false
finetuning_type: lora
lora_target: q_proj,v_proj,k_proj,o_proj
lora_rank: 8
lora_alpha: 32
lora_dropout: 0.1
# flash_attn: fa2

### dataset
dataset: enhancer_train
dataset_dir: data
template: qwen
cutoff_len: 1024
# max_samples: 10
overwrite_cache: true
preprocessing_num_workers: 16
tokenized_path: tkd_data/enhancer

### output
output_dir: saves/qwen2.5-7b-enhancer
logging_steps: 1
save_steps: 800
# save_steps: 1
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
optim: adamw_torch
learning_rate: 0.0001
num_train_epochs: 3
# max_steps: 5
lr_scheduler_type: cosine
warmup_ratio: 0.1
# warmup_steps: 10
bf16: true
ddp_timeout: 180000000
# max_grad_norm: 1.0
# neftune_noise_alpha: 0

### eval
# val_size: 0.1
eval_dataset: enhancer_test
per_device_eval_batch_size: 16
eval_strategy: steps
eval_steps: 800
# eval_steps: 1
save_total_limit: 5
load_best_model_at_end: true
metric_for_best_model: eval_rouge-l